    <script>
      // 관리자(/admin)·공급사 센터(/supplier)는 홈 화면에 추가하면 앱처럼 열리는 manifest를 씁니다(공개 화면은 위 그대로).
      // 화면 이동 뒤에는 src/lib/app-install.ts(applyAppHead)가 같은 규칙으로 바꿉니다.
      (function () {
        var p = location.pathname;
        var area = p === "/admin" || p.indexOf("/admin/") === 0 || p === "/auth" ? "admin" : p === "/supplier" || p.indexOf("/supplier/") === 0 ? "supplier" : "";
        if (!area) return;
        var link = document.querySelector('link[rel="manifest"]');
        if (link) link.setAttribute("href", "/" + area + ".webmanifest");
        var title = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (title) title.setAttribute("content", area === "admin" ? "두고푸드" : "두고푸드 공급사");
        [["apple-mobile-web-app-capable", "yes"], ["mobile-web-app-capable", "yes"], ["apple-mobile-web-app-status-bar-style", "default"]].forEach(function (pair) {
          var meta = document.createElement("meta");
          meta.name = pair[0];
          meta.content = pair[1];
          document.head.appendChild(meta);
        });
      })();
    </script>
