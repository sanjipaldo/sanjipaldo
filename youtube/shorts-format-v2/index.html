<!doctype html>
<html lang="ko" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Pretendard"; font-weight: 900; src: url("assets/fonts/Pretendard-Black.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 800; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 600; src: url("assets/fonts/Pretendard-SemiBold.woff2") format("woff2"); }
      :root { --accent: #FF3B3B; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0D0B0B; }
      body { font-family: "Pretendard", sans-serif; color: #fff; }

      #faceClip { position: absolute; inset: 0; z-index: 2; }
      #faceMove { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #facePh { position: absolute; inset: 0; }
      .ph-label { position: absolute; left: 0; width: 1080px; top: 1150px; text-align: center;
                  font-weight: 700; font-size: 40px; color: rgba(255,255,255,.6); }

      .panel { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; z-index: 1; overflow: hidden;
               background: radial-gradient(ellipse 90% 80% at 50% 70%, #2A1B19 0%, #161112 55%, #0D0B0B 100%); }
      .tabs { position: absolute; left: 117px; top: 250px; display: flex; gap: 24px; }
      .tab { width: 150px; height: 96px; border-radius: 18px; background: rgba(255,255,255,.05); border: 2px solid rgba(255,255,255,.12);
             display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 44px; color: rgba(255,255,255,.4); }
      .tab.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); color: #fff; }
      .bbar { position: absolute; left: 70px; top: 596px; width: 940px; height: 64px; border-radius: 16px; background: #F1EFEC;
              display: flex; align-items: center; padding: 0 24px; gap: 10px; }
      .bdot { width: 15px; height: 15px; border-radius: 50%; }
      .burl { flex: 1; text-align: center; font-weight: 700; font-size: 24px; color: #5B5552; margin-right: 60px; }
      .card { position: absolute; left: 70px; top: 676px; width: 940px; height: 200px; border-radius: 26px; background: #1F1A19;
              border: 2px solid #3A302D; display: flex; align-items: center; gap: 30px; padding: 0 34px; }
      .card img { width: 116px; height: 116px; border-radius: 26px; }
      .card .lb { font-weight: 600; font-size: 26px; color: #A79C96; margin-bottom: 6px; }
      .card .tt { font-weight: 900; font-size: 64px; letter-spacing: -1.5px; }
      .badge { position: absolute; right: 30px; top: 26px; background: var(--accent); color: #fff; font-weight: 800; font-size: 34px;
               padding: 6px 18px; border-radius: 12px; }
      .shot { position: absolute; left: 158px; top: 182px; width: 764px; height: 600px; border-radius: 22px; overflow: hidden;
              box-shadow: 0 30px 80px rgba(0,0,0,.55); }
      .shot img { width: 764px; height: 600px; display: block; }
      .chip { position: absolute; left: 182px; top: 726px; background: var(--accent); color: #fff; font-weight: 800; font-size: 28px;
              padding: 8px 18px; border-radius: 10px; }

      .cap { position: absolute; left: 0; width: 1080px; text-align: center; z-index: 5; }
      .cap.split { bottom: 910px; }   /* block bottom sits on the seam, like the reference */
      .cap.face { bottom: 620px; }    /* full-face shots: under the mouth, inside the safe band */
      .cap-in { display: inline-block; }
      .l1, .l2 { font-weight: 900; font-size: 88px; line-height: 1.12; letter-spacing: -2.5px;
                 text-shadow: 0 5px 0 rgba(0,0,0,.35), 0 0 28px rgba(0,0,0,.75), 0 0 6px rgba(0,0,0,.9); }
      .l2 { color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920">
      <div id="faceClip">
        <div id="faceMove">
          <div id="facePh" class="clip" data-start="0" data-duration="9" data-track-index="1">
            <svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute; inset:0">
              <defs>
                <linearGradient id="room" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A4636" /><stop offset="1" stop-color="#241A15" /></linearGradient>
                <radialGradient id="lamp" cx="0.12" cy="0.55" r="0.35"><stop offset="0" stop-color="#FFCF8A" stop-opacity="0.45" /><stop offset="1" stop-color="#FFCF8A" stop-opacity="0" /></radialGradient>
                <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E2A29" /><stop offset="1" stop-color="#1A1817" /></linearGradient>
              </defs>
              <rect width="1080" height="1920" fill="url(#room)" />
              <rect width="1080" height="1920" fill="url(#lamp)" />
              <path d="M150 1920 C170 1300 230 1080 540 1000 C850 1080 910 1300 930 1920 Z" fill="url(#body)" />
              <rect x="472" y="800" width="136" height="230" rx="40" fill="#B08E7A" />
              <ellipse cx="540" cy="640" rx="152" ry="190" fill="#C39E88" />
            </svg>
            <div class="ph-label">얼굴 영상 자리</div>
          </div>
        </div>
      </div>

      <!-- A · split: step card -->
      <div id="pa" class="clip panel" data-start="0" data-duration="3.4" data-track-index="2">
        <div class="tabs" id="tabs"><div class="tab on">1</div><div class="tab">2</div><div class="tab">3</div><div class="tab">4</div><div class="tab">5</div></div>
        <div class="bbar" id="bbar"><span class="bdot" style="background:#FF5F57"></span><span class="bdot" style="background:#FEBC2E"></span><span class="bdot" style="background:#28C840"></span><span class="burl">두고마켓 셀러센터</span></div>
        <div class="card" id="card">
          <img src="assets/doogo-icon.png" alt="" />
          <div><div class="lb">두고마켓 셀러센터 · 1단계</div><div class="tt">상품 소싱</div></div>
          <div class="badge" id="badge">1번</div>
        </div>
      </div>

      <!-- B · split + punch-in: real screen -->
      <div id="pb" class="clip panel" data-start="3.4" data-duration="2.6" data-track-index="2">
        <div class="shot" id="shot"><img src="assets/seller.jpg" alt="" /></div>
        <div class="chip" id="chip">실제 셀러센터 화면</div>
      </div>

      <div id="c1" class="clip cap split" data-start="0.25" data-duration="1.45" data-track-index="3"><div class="cap-in"><div class="l1">첫 번째는</div></div></div>
      <div id="c2" class="clip cap split" data-start="1.7" data-duration="1.65" data-track-index="3"><div class="cap-in"><div class="l1">마음에 드는 상품</div><div class="l2">PICK 하기</div></div></div>
      <div id="c3" class="clip cap split" data-start="3.45" data-duration="2.5" data-track-index="3"><div class="cap-in"><div class="l1">판매가만 정하면</div><div class="l2">등록 끝</div></div></div>
      <div id="c4" class="clip cap face" data-start="6.05" data-duration="2.85" data-track-index="3"><div class="cap-in"><div class="l1">이 방법이 필요하면</div><div class="l2">댓글에 '두고'</div></div></div>

      <audio id="s1" src="assets/sfx/pop.mp3" data-start="0.55" data-duration="0.72" data-track-index="4" data-volume="0.3"></audio>
      <audio id="s2" src="assets/sfx/whoosh-short.mp3" data-start="3.32" data-duration="0.57" data-track-index="5" data-volume="0.35"></audio>
      <audio id="s3" src="assets/sfx/whoosh-short.mp3" data-start="5.92" data-duration="0.57" data-track-index="5" data-volume="0.35"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const Y = 640;
      // face: split -> split punch-in (hard cut, slow drift) -> full-face close-up
      tl.set("#faceClip", { clipPath: "inset(50% 0% 0% 0%)" }, 0);
      tl.set("#faceMove", { y: Y, scale: 1, transformOrigin: "50% 34%" }, 0);
      tl.set("#faceMove", { scale: 1.6 }, 3.4);
      tl.to("#faceMove", { scale: 1.66, duration: 2.6, ease: "none" }, 3.4);
      tl.set("#faceClip", { clipPath: "inset(0% 0% 0% 0%)" }, 6.0);
      tl.set("#faceMove", { y: 0, scale: 1.28 }, 6.0);
      tl.to("#faceMove", { scale: 1.34, duration: 3.0, ease: "none" }, 6.0);

      // A
      tl.from("#tabs", { opacity: 0, y: -20, duration: 0.3, ease: "power2.out" }, 0.1);
      tl.from("#bbar", { opacity: 0, y: 30, duration: 0.35, ease: "power3.out" }, 0.2);
      tl.from("#card", { opacity: 0, y: 40, duration: 0.4, ease: "power3.out" }, 0.3);
      tl.from("#badge", { scale: 0, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(3)" }, 0.55);
      // B
      tl.from("#shot", { opacity: 0, y: 50, scale: 0.96, duration: 0.4, ease: "power3.out" }, 3.4);
      tl.from("#chip", { opacity: 0, y: 14, duration: 0.25, ease: "power2.out" }, 3.75);
      // captions
      [["#c1",0.25,1.7],["#c2",1.7,3.35],["#c3",3.45,5.95],["#c4",6.05,8.9]].forEach(([c,s,e]) => {
        tl.from(c + " .cap-in", { scale: 0.88, opacity: 0, duration: 0.14, ease: "power2.out" }, s);
        tl.to(c + " .cap-in", { opacity: 0, duration: 0.1, ease: "power2.in" }, e - 0.1);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
